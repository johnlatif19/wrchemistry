<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - WR Chemistry</title>
    <link rel="stylesheet" href="css/sign-student.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/assets/images/wrchemistry.webp">
</head>
<body>
    <div class="theme-toggle" id="themeToggle">
        <span class="icon-sun"></span>
        <span class="icon-moon"></span>
    </div>

    <div class="auth-container">
        <div class="auth-card wide">
            <div class="brand-header">
                <img src="/assets/images/wrchemistry.webp" alt="WR Chemistry" class="logo">
                <h1>إنشاء حساب جديد</h1>
                <p>انضم إلينا لتبدأ رحلتك في الكيمياء</p>
            </div>

            <form id="registerForm" class="auth-form">
                <div class="input-row">
                    <div class="input-group">
                        <label for="fullName">الاسم بالكامل</label>
                        <input type="text" id="fullName" name="fullName" placeholder="أدخل اسمك الثلاثي" required>
                    </div>
                    <div class="input-group">
                        <label for="studentCode">كود الطالب</label>
                        <input type="text" id="studentCode" name="studentCode" placeholder="مثال: 12345" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" placeholder="example@domain.com" required>
                </div>

                <div class="input-group">
                    <label for="phone">رقم الهاتف</label>
                    <input type="tel" id="phone" name="phone" placeholder="01xxxxxxxxx" required>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="password">كلمة المرور</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" placeholder="8 أحرف على الأقل" required minlength="8">
                            <button type="button" class="toggle-password" id="togglePassword">إظهار</button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="confirmPassword">تأكيد كلمة المرور</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="أعد كتابة كلمة المرور" required minlength="8">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    <span class="btn-text">تسجيل الحساب</span>
                    <span class="spinner hidden"></span>
                </button>
            </form>

            <div class="divider">
                <span>أو سجل باستخدام</span>
            </div>

            <div class="social-login">
                <button type="button" class="btn-social google" id="googleSignup">
                    <span>Google</span>
                </button>
                <button type="button" class="btn-social facebook" id="facebookSignup">
                    <span>Facebook</span>
                </button>
            </div>

            <div class="auth-footer">
                <p>لديك حساب بالفعل؟ <a href="login-student.html">تسجيل الدخول</a></p>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="js/api-client.js"></script>
    <script src="js/sign-student.js"></script>
</body>
</html>
