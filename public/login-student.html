<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - WR Chemistry</title>
    <link rel="stylesheet" href="css/login-student.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/assets/images/wrchemistry.webp">
</head>
<body>
    <div class="theme-toggle" id="themeToggle">
        <span class="icon-sun"></span>
        <span class="icon-moon"></span>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="brand-header">
                <img src="/assets/images/wrchemistry.webp" alt="WR Chemistry" class="logo">
                <h1>مرحباً بعودتك</h1>
                <p>سجل الدخول لمتابعة دروسك وواجباتك</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="input-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" placeholder="أدخل بريدك الإلكتروني" required>
                </div>

                <div class="input-group">
                    <label for="password">كلمة المرور</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required>
                        <button type="button" class="toggle-password" id="togglePassword">إظهار</button>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="#" class="forgot-link" id="forgotPassword">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    <span class="btn-text">دخول</span>
                    <span class="spinner hidden"></span>
                </button>
            </form>

            <div class="divider">
                <span>أو سجل باستخدام</span>
            </div>

            <div class="social-login">
                <button type="button" class="btn-social google" id="googleLogin">
                    <span>Google</span>
                </button>
                <button type="button" class="btn-social facebook" id="facebookLogin">
                    <span>Facebook</span>
                </button>
            </div>

            <div class="auth-footer">
                <p>ليس لديك حساب؟ <a href="sign-student.html">إنشاء حساب جديد</a></p>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="js/api-client.js"></script>
    <script src="js/login-student.js"></script>
</body>
</html>
