<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول الإدارة - WR Chemistry</title>
    <link rel="stylesheet" href="css/login-admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/images/wrchemistry.webp">
</head>
<body>
    <div class="theme-toggle" id="themeToggle">
        <span class="icon-sun"></span>
        <span class="icon-moon"></span>
    </div>

    <div class="auth-container">
        <div class="auth-card admin-card">
            <div class="brand-header">
                <img src="assets/images/wrchemistry.webp" alt="WR Chemistry" class="logo">
                <h1>لوحة التحكم</h1>
                <p>مخصص للمعلم فقط</p>
            </div>

            <form id="adminLoginForm" class="auth-form">
                <div class="input-group">
                    <label for="username">اسم المستخدم</label>
                    <input type="text" id="username" name="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
                </div>

                <div class="input-group">
                    <label for="password">كلمة المرور</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword">إظهار</button>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    <span class="btn-text">دخول آمن</span>
                    <span class="spinner hidden"></span>
                </button>
            </form>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="js/api-client.js"></script>
    <script src="js/login-admin.js"></script>
</body>
</html>
