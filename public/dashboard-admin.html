<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - WR Chemistry</title>
    <link rel="stylesheet" href="/css/dashboard-admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/assets/images/wrchemistry.webp">
    <style>
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; z-index: 2000;
            align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--card-bg); padding: 30px; border-radius: 12px;
            width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto;
            box-shadow: var(--shadow); border: 1px solid var(--border);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { font-size: 20px; color: var(--primary); }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;
            background: var(--bg-color); color: var(--text-main); font-family: inherit;
        }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border); }
        th { background: var(--bg-color); font-weight: 700; }
        .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 4px; cursor: pointer; border: none; font-family: inherit; font-weight: 600; }
        .btn-edit { background: var(--warning); color: white; margin-left: 5px; }
        .btn-delete { background: var(--error); color: white; }
        .btn-grade { background: var(--primary); color: white; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <img src="/assets/images/wrchemistry.webp" alt="WR Chemistry" class="logo-small">
                <span class="brand-name">WR Chemistry</span>
            </div>
            
            <nav class="sidebar-nav">
                <button class="nav-item active" data-section="dashboard">لوحة القيادة</button>
                <button class="nav-item" data-section="all-assignments">جميع الواجبات</button>
                <button class="nav-item" data-section="students">الطلاب</button>
                <button class="nav-item" data-section="correct-answers">الإجابات الصحيحة</button>
                <button class="nav-item" data-section="incorrect-answers">الإجابات الخاطئة</button>
                <button class="nav-item" data-section="essay-grading">تصحيح المقالات</button>
                <button class="nav-item" data-section="cheating">الغش</button>
            </nav>

            <div class="sidebar-footer">
                <button id="adminLogoutBtn" class="btn-logout">تسجيل الخروج</button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="main-header">
                <h1 id="sectionTitle">لوحة القيادة</h1>
                <div class="admin-info">
                    <span>مرحباً، أ. وليد</span>
                </div>
            </header>

            <div id="sectionContent" class="content-area">
                <div class="loading-state">
                    <span class="spinner"></span>
                    <p>جاري التحميل...</p>
                </div>
            </div>
        </main>
    </div>

    <div id="editStudentModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>تعديل بيانات الطالب</h2>
                <button class="modal-close" onclick="document.getElementById('editStudentModal').classList.remove('active')">&times;</button>
            </div>
            <form id="editStudentForm">
                <input type="hidden" id="editStudentId">
                <div class="form-group">
                    <label>الاسم بالكامل</label>
                    <input type="text" id="editFullName" required>
                </div>
                <div class="form-group">
                    <label>كود الطالب</label>
                    <input type="text" id="editStudentCode" required>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="editEmail" required>
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" id="editPhone" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">حفظ التعديلات</button>
            </form>
        </div>
    </div>

    <div id="gradeEssayModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>تصحيح المقال</h2>
                <button class="modal-close" onclick="document.getElementById('gradeEssayModal').classList.remove('active')">&times;</button>
            </div>
            <form id="gradeEssayForm">
                <input type="hidden" id="gradeAnswerId">
                <div class="form-group">
                    <label>إجابة الطالب:</label>
                    <div id="essayTextPreview" style="background: var(--bg-color); padding: 10px; border-radius: 6px; margin-bottom: 10px; white-space: pre-wrap;"></div>
                </div>
                <div class="form-group">
                    <label>الدرجة (من <span id="maxMarksDisplay"></span>)</label>
                    <input type="number" id="essayScore" min="0" required>
                </div>
                <div class="form-group">
                    <label>ملاحظات / تعليق</label>
                    <textarea id="essayFeedback" rows="3"></textarea>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">حفظ الدرجة</button>
            </form>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="/js/api-client.js"></script>
    <script src="/js/dashboard-admin.js"></script>
</body>
</html>
