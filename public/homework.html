<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الواجبات - WR Chemistry</title>
    <link rel="stylesheet" href="/css/homework.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/assets/images/wrchemistry.webp">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <div class="brand">
                <img src="/assets/images/wrchemistry.webp" alt="WR Chemistry" class="logo-small">
                <span class="brand-name">WR Chemistry</span>
            </div>
            <div class="user-info">
                <span id="userName" class="user-name">جاري التحميل...</span>
                <button id="logoutBtn" class="btn-logout">تسجيل الخروج</button>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <aside class="sidebar">
            <nav class="side-nav">
                <button class="nav-item active" data-tab="available">الواجبات المتاحة</button>
                <button class="nav-item" data-tab="upcoming">الواجبات القادمة</button>
                <button class="nav-item" data-tab="completed">الواجبات المكتملة</button>
                <button class="nav-item" data-tab="results">النتائج</button>
            </nav>
        </aside>

        <section class="main-content">
            <div id="loadingState" class="loading-state">
                <span class="spinner"></span>
                <p>جاري تحميل البيانات...</p>
            </div>

            <div id="emptyState" class="empty-state hidden">
                <p>لا توجد واجبات في هذا القسم حالياً.</p>
            </div>

            <div id="errorState" class="error-state hidden">
                <p id="errorMessage">حدث خطأ أثناء تحميل البيانات.</p>
                <button id="retryBtn" class="btn-secondary">إعادة المحاولة</button>
            </div>

            <div id="assignmentsGrid" class="assignments-grid hidden">
            </div>
        </section>
    </main>

    <div id="toastContainer" class="toast-container"></div>

    <script src="/js/api-client.js"></script>
    <script src="/js/homework.js"></script>
</body>
</html>
